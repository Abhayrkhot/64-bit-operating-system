name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (same packages as docker/dev.Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm libclang-rt-18-dev qemu-system-x86 ovmf mtools dosfstools

      - name: Enable KVM if the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Build loader, kernel, user programs, image, host tools
        run: make -j"$(nproc)" all

      - name: Host unit tests
        run: make htest

      - name: Kernel tests (KVM if available)
        run: python3 tools/qemu.py --cmdline "test=all fuzz_iters=50000" --data-disk --timeout 900

      - name: Kernel tests under TCG
        run: python3 tools/qemu.py --cmdline "test=all fuzz_iters=20000" --data-disk --accel tcg --timeout 900

      - name: Crash simulation (journal, torn writes)
        run: for s in 1 2 3; do build/host/crashsim --seed "$s" --states 2000 --torn --quiet; done

      - name: QEMU kill test
        run: python3 tools/crashtest.py --trials 5 --ops 3000 --max-kill 1.5

      - name: Fuzz the ELF validator
        run: make fuzz-elf FUZZ_SECONDS=60
